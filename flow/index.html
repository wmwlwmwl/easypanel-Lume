<script src="{{$PSTATIC}}/style/js/highcharts.js" type="text/javascript"></script>
<!-- 添加主题样式js文件 -->
<script src="{{$PSTATIC}}/style/js/themes/grid.js" type="text/javascript"></script>
<!--添加导出模式 -->
<script src="{{$PSTATIC}}/style/js/modules/exporting.js" type="text/javascript"></script>
<script src="{{$STATIC}}js/chart-common.js?v=1"></script>
<script type="text/javascript">
	var chart;
	$(document).ready(function () {
		epChartSetup();
		chart = new Highcharts.Chart({
			chart: {
				renderTo: 'flow',
				defaultSeriesType: 'line', //图表类型 line, spline, area, areaspline, column, bar, pie , column，scatter
				inverted: false //左右显示，默认上下正向。假如设置为true，则横纵坐标调换位置
			},
			xAxis: {
				categories: [{{$cate}}] //X轴的坐标值
			},
			yAxis: {
			    title: {text: '流量 (Bytes)'},  //Y轴坐标标题  labels:纵柱标尺
				min:0
			},
			tooltip: {
				formatter: function() {
					//当鼠标悬置数据点时的格式化提示
					return '流量:' + epFormatBytes(this.y, {threshold: 10, units: [' Bytes', ' KB', ' MB', ' GB']}) + '<br/>当前时间:'+ this.x ;
				}
			},
			plotOptions: {
				column: {
					pointPadding: 0.2,  //图表柱形的
					borderWidth: 0      //图表柱形的粗细
				},bar: {
					dataLabels: {
						enabled: true
					}
				}
			},
			title: { text: '当{{$datename}}流量示意图(单位:Bytes)' }, //图表主标题
			series:[{ {{$flow}} },{ {{$flow_cache}} }]
		});
	});
</script>
<div class="main">
    <div class="public_pa">流量查看 [<a href="?c=flow&a=viewFlow&t=day">最近24小时</a>] [<a href="?c=flow&a=viewFlow&t=month">最近31天</a>]</div>
	<div id="flow" class="ep-chart"></div>
</div>
