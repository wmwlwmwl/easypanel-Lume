<header class="ep-header">
	<div class="ep-header-inner">
		<a class="ep-brand" href="?c=index&amp;a=main" aria-label="easypanel 面板首页">
			<span class="ep-brand-mark">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"></path><path d="M3 13l9 5 9-5"></path></svg>
			</span>
			<span>Lume</span>
		</a>
		<nav class="ep-nav">
			<a class="ep-nav-item{{if !$smarty.get.c || $smarty.get.c=='index'}} is-active{{/if}}" href="?c=index&amp;a=main">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"></path><path d="M5 10v10h14V10"></path></svg>
				面板首页
			</a>
			<a class="ep-nav-item{{if $smarty.get.c=='domain'}} is-active{{/if}}" href="?c=domain&amp;a=show">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9Z"></path></svg>
				域名绑定
			</a>
			{{if $user.cdn==0}}{{if $webftp_url}}
			<a class="ep-nav-item{{if $smarty.get.c=='webftp'}} is-active{{/if}}" href="{{$webftp_url}}">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path></svg>
				在线文件
			</a>
			{{/if}}{{/if}}
			<a class="ep-nav-item{{if $smarty.get.c=='connection'}} is-active{{/if}}" href="?c=connection&amp;a=connectionFrom">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
				连接信息
			</a>
			<a class="ep-nav-item{{if $smarty.get.c=='capability'}} is-active{{/if}}" href="?c=capability&amp;a=capabilityFrom">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-7 4 14 2-7h6"></path></svg>
				性能分析
			</a>
			{{if $smarty.session.login_from=='vhost'}}
			<a class="ep-nav-item" href="?c=session&amp;a=logout">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.5 6.5a8 8 0 1 0 11 0"></path></svg>
				安全退出
			</a>
			{{/if}}
		</nav>
		<span class="ep-user">
			<span class="ep-avatar">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
			</span>
			<span class="ep-user-name">{{$vhost}}</span>
		</span>
	</div>
</header>
