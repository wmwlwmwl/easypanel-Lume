<script type="text/template" id="aceTmplate">
    <div id="ace_conter">
        <div class="ace_header" style="top: 0">
            <span class="saveFile"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4a1 1 0 0 1 1-1h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4Z"></path><path d="M8 3v6h7V3"></path><rect x="8" y="13" width="8" height="8" rx="1"></rect></svg><span>保存</span></span>
            <span class="refreshs"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.7-6.5"></path><path d="M21 3v6h-6"></path></svg><span>刷新</span></span>
            <span class="searchs"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20.5 20.5-4-4"></path></svg><span>搜索</span></span>
            <span class="replaces"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg><span>替换</span></span>
            <span class="jumpLine"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l-1 5 4 4v2H6v-2l4-4-1-5Z"></path></svg><span>跳转行</span></span>
            <span class="fontSize"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V5h14v2"></path><path d="M12 5v14"></path><path d="M9 19h6"></path></svg><span>字体</span></span>
            <span class="themes"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span>主题</span></span>
            <span class="setUp"><svg class="ep-ed-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2"></circle><circle cx="15" cy="12" r="2"></circle><circle cx="7" cy="17" r="2"></circle></svg><span>设置</span><div class="red-poins" style="display: none;"></div></span>
            <div class="pull-down" title="隐藏工具条" style="top: 0"><i class="glyphicon glyphicon-menu-down" aria-hidden="true"></i></div>
        </div>
        <div class="ace_overall" style="top: 30px;">
            <!-- 编辑内容 -->
            <div class="ace_editor_main" style="left:0px">
                <div class="ace_conter_editor"></div>
                <div class="ace_conter_toolbar">
                    <div class="pull-left size_ellipsis">
                        <span data-type="path" class="size_ellipsis"></span>
                    </div>
                    <div class="pull-right">
                        <span data-type="cursor"></span>
                        <span data-type="tab"></span>
                        <span data-type="encoding"></span>
                        <span data-type="readOnly"></span>
                    </div>
                </div>
            </div>
            <div class="ace_toolbar_menu" style="display: none;">
                <div class="menu-item menu-tabs" style="display: none;">
                    <div class="menu-title">设置制表符</div>
                    <ul class="tabsType">
                        <li data-value="nbsp">使用空格缩进</li>
                        <li data-value="tabs">使用 "Tab" 缩进</li>
                    </ul>
                    <div class="menu-title" style="margin-top:15px">设置制表符长度</div>
                    <ul class="tabsSize">
                        <li data-value="1">1</li>
                        <li data-value="2">2</li>
                        <li data-value="3">3</li>
                        <li data-value="4">4</li>
                        <li data-value="5">5</li>
                        <li data-value="6">6</li>
                    </ul>
                </div>
                <div class="menu-item menu-encoding" style="display: none;">
                    <div class="menu-title">设置文件保存编码格式</div>
                    <ul></ul>
                </div>
                <div class="menu-item menu-fontSize" style="display: none;">
                    <div class="menu-title">设置编辑器字体大小</div>
                    <div class="menu-conter">
                        <div class="set_font_size">
                            <input type="number" min="12" max="45"/>
                            <span class="tips error">字体设置范围 12-45</span>
                            <button class="btn-save">保存</button>
                        </div>
                    </div>
                </div>
                <div class="menu-item menu-jumpLine" style="display: none;">
                    <div class="menu-title">跳转到指定行</div>
                    <div class="menu-conter">
                        <div class="set_jump_line">
                            <input type="number" min="0"/>
                            <div class="jump_tips">当前：行&nbsp;<span></span>&nbsp;，列&nbsp;<span></span>&nbsp;，输入行数(介于&nbsp;1&nbsp;-&nbsp;<span></span>&nbsp;之间)</div>
                        </div>
                    </div>
                </div>
                <div class="menu-item menu-themes" style="display: none;">
                    <div class="menu-title">设置编辑器主题</div>
                    <ul></ul>
                </div>
                <div class="menu-item menu-setUp"  style="display: none;">
                	<div class="menu-title">编辑器设置【部分设置需要重新打开编辑生效】</div>
                	<ul class="editor_menu">
                		<li data-type="wrap">自动换行</li>
                		<li data-type="enableLiveAutocompletion">代码自动完成</li>
                		<li data-type="enableSnippets">启用代码段</li>
                		<li data-type="showInvisibles">显示隐藏字符</li>
                		<li data-type="showLineNumbers">显示行号</li>
                	</ul>
                </div>
            </div>
        </div>
    </div>
</script>
