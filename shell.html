<html>
<head>
<script src='/style/jquery.js'>
</script>
<style>#out{white-space:pre-wrap;word-break:break-word;}</style>
<script>
var session='{{$session|escape:'javascript'}}';
function check_result(result)
{
	var out = $('<div>').text(result['out']).html().replace(/ /g, '&nbsp;').replace(/\n/g, '<br>');
	$('#out').append(out);
	whm_result(result['code']);
}
function whm_query()
{
	$.getJSON('?c=shell&a=query&session=' + session,check_result);
}
function whm_result(code)
{	
	$('#status').empty();
	if (code==201) {
		$('#status').append("<img src='/style/busy.gif' border='0'/>");
		setTimeout(whm_query,2000);
	} else if(code==200) {
		$('#status').append('完成');	
	} else {
		$('#status').append('执行错误:'+code);
	}
}
$(document).ready(function(){
	var code={{$code}};
	whm_result(code);
});
</script>
</head>
<body>
<div id='shell'>
	<div id='out'>{{$out|escape:'html'}}</div>
	<div id='status'></div>
	<div id='toolbox'></div>
</div>
</body>
</html>
