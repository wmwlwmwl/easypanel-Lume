<div class="main">
	<div class="public_pa">模板环境设置</div>
	{{if $msg}}
	<div class="ep-hint ep-text-danger" role="alert">{{$msg|escape:'html'}}</div>
	{{/if}}
	<div class="ep-form-body">
		{{foreach item=e from=$env}}
		<form action='?c=tplenv&a=setEnv' method='post' class="ep-form-row">
			<span class="ep-form-label">{{$lang[$e.name]}}</span>
			<input type='hidden' name='name' value='{{$e.name}}' />
			{{if $e.value.0=='TEXT'}}
			<input type='text' name='{{$e.name}}' value='{{if !$e.password}}{{$val[$e.name]}}{{/if}}' />
			{{elseif $e.value.0=='RADIO'}}
			{{foreach item=v from=$e.value.1}}
			<label><input type='radio' name='{{$e.name}}' {{if $val[$e.name]==$v.1}}checked{{/if}} value='{{$v.1}}'> {{$lang[$v.0]}}</label>
			{{/foreach}}
			{{elseif $e.value.0=='CHECKBOX'}}
			<span class="ep-hint">CHECKBOX</span>
			{{/if}}
			<input type='submit' value='设置' class="btn btn-primary" />
		</form>
		{{/foreach}}
	</div>
</div>
