<script>
function changePw()
{
	var pw = $("#webpasswd").val();
	if(pw=="")return;
	ep_ajax("?c=session&a=changePassword", {passwd: pw}, {type: "get", raw: true, reload: false, sync: false});
}
function changeDb()
{
	var pw = $("#dbpasswd").val();
	if(pw=="")return;
	ep_ajax("?c=session&a=changeDbPassword", {passwd: pw}, {type: "get", raw: true, reload: false, sync: false});
}
</script>

<div class="main">
	<div class="public_pa">修改密码</div>
	<div class="ep-form-body">
		<form action="javascript:changePw();">
			<div class="ep-form-row">
				<span class="ep-form-title">修改用户登陆密码</span>
			</div>
			<div class="ep-form-row">
				<span class="ep-form-label">新密码</span>
				<input type="password" name="passwd" id="webpasswd" />
				<input type="submit" value="确定" class="btn btn-primary" />
			</div>
		</form>

		{{if $db_limit}}
		<form action="javascript:changeDb();" method="post">
			<div class="ep-form-row">
				<span class="ep-form-title">修改数据库密码</span>
			</div>
			<div class="ep-form-row">
				<span class="ep-form-label">新密码</span>
				<input type="password" name="passwd" id="dbpasswd" />
				<input type="submit" value="确定" class="btn btn-primary" />
			</div>
		</form>
		{{/if}}
	</div>
</div>
